<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cuadro-principal">

        <div class="formulario">
            <h1>Stay Updated!</h1>

        <div class="text">
            <p>Join 60.000+ product managers receiving monthly updates on:</p>
        </div>
        <div class="checklist">
            <label><input type="checkbox">Product discovery and building what matters.</label>
            <label><input type="checkbox">Measuring to ensure updates are a success.</label>
            <label><input type="checkbox">And much more!</label>
        </div>
        <form>
            <div class="emailaddress">
                <p>Email address</p>
            </div>
            <div class="input-box">
                <input type="email" placeholder="Enter your email" required>
            </div>
        </form>
        <div class="btn">
            <button>Subscribe to monthly newsletter</button>
        </div>
        </div>

        <div class="imagen">
            <img src="img/stayup.jpg" alt="">
        </div>
        
    </div>
